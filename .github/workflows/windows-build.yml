name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --onefile --windowed --name "JGJG Video Studio" main.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JGJG-Video-Studio-Windows
          path: dist/JGJG Video Studio.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/JGJG Video Studio.exe" --generate-notes
