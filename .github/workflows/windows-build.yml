name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install pyinstaller
      - name: Download FFmpeg LGPL shared build
        shell: pwsh
        run: |
          $asset = "ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          $release = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          Invoke-WebRequest "$release/$asset" -OutFile ffmpeg.zip
          Invoke-WebRequest "$release/checksums.sha256" -OutFile checksums.sha256
          $checksumLine = Get-Content checksums.sha256 | Where-Object { $_.EndsWith($asset) } | Select-Object -First 1
          if (-not $checksumLine) { throw "No upstream SHA-256 checksum found for $asset" }
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package -Force
          $ffmpegExe = Get-ChildItem ffmpeg-package -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegExe) { throw "FFmpeg executable not found in downloaded archive" }
          New-Item -ItemType Directory -Force vendor/ffmpeg/bin | Out-Null
          Copy-Item (Join-Path $ffmpegExe.DirectoryName "*") vendor/ffmpeg/bin -Force
          New-Item -ItemType Directory -Force third-party | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n8.1/COPYING.LGPLv2.1" -OutFile third-party/FFmpeg-COPYING.LGPLv2.1.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable with bundled FFmpeg
        run: pyinstaller --onefile --windowed --name "JGJG Video Studio" --add-data "vendor/ffmpeg/bin;ffmpeg" main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "installer\JGJG Video Studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with code $LASTEXITCODE" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JGJG-Video-Studio-Windows-Installer
          path: dist/installer/JGJG-Video-Studio-Setup.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/installer/JGJG-Video-Studio-Setup.exe" --generate-notes
